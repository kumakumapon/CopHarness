name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  test:
    name: Checks (Node.js ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22.23.4", "24.22.1", "26.12.1"]

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Dependency audit (production, high+)
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Run all tests
        run: npm test

      - name: Typecheck
        run: npm run typecheck

      - name: Deterministic agent evaluation
        run: npm run eval:mock

      - name: Production build
        run: npm run build

      - name: Minimal and full production runtime smoke checks
        run: npm run smoke:profiles
